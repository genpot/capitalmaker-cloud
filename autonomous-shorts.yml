name: CapitalMaker Auto-Shorts Video Factory (#5)

on:
  schedule:
    - cron: '0 9,18 * * *'
  workflow_dispatch:

jobs:
  generate-and-deliver-short:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Python Video Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -r CapitalMakerCloud/requirements.txt

      - name: Render 1080x1920 Vertical Solana Breakout Short
        env:
          BRAND_NAME: ${{ secrets.BRAND_NAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_VIDEO_CHAT_ID: ${{ secrets.TELEGRAM_VIDEO_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python CapitalMakerCloud/scripts/shorts_factory.py

      - name: Save Rendered Short MP4 as Downloadable Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capitalmaker-latest-short
          path: |
            output/latest_short.mp4
            output/latest_short_meta.json
          retention-days: 7
