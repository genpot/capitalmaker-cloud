name: Render 3 Fluid Live-Action Commercial Ads (Apple iOS & Android)

on:
  workflow_dispatch:
    inputs:
      hub_url:
        description: "Your Netlify Hub URL (optional)"
        required: false
        default: "https://t.me/MysolAlpha99"
      which_ad:
        description: "Which video to render (all, ad1_glamorous_woman, ad2_busy_worker, ad3_young_couple)"
        required: false
        default: "all"

jobs:
  render-cinematic-ads:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg & Python Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -r CapitalMakerCloud/requirements.txt

      - name: Render 3 Fluid 30fps Live-Action Commercials
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          HUB_URL: ${{ github.event.inputs.hub_url }}
        run: python CapitalMakerCloud/scripts/cinematic_ads_pack.py --only "${{ github.event.inputs.which_ad || 'all' }}"

      - name: Upload All 3 Commercial MP4s
        uses: actions/upload-artifact@v4
        with:
          name: capital-alpha-3-live-action-ads
          path: output/cinematic_ads/*.mp4
          retention-days: 30
