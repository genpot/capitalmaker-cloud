name: Render 30 Rotating Live-Action Commercial Ads (Every 30m — Apple iOS & Android)

on:
  schedule:
    # Runs every 30 minutes (:10 and :40 — staggered cleanly from Shorts & Promo!)
    - cron: "10,40 * * * *"
  workflow_dispatch:
    inputs:
      hub_url:
        description: "Your Capital Alpha Hub URL"
        required: false
        default: "https://capitalalpha.pages.dev"
      which_ad:
        description: "rotate (1 fresh video from 30 themes), all (all 3 core ads), ad1_glamorous_woman, ad2_busy_worker, or ad3_young_couple"
        required: false
        default: "rotate"

jobs:
  render-cinematic-ads:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg & Python Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -r CapitalMakerCloud/requirements.txt

      - name: Render Rotating 30-Theme Real Live-Action Commercial
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          HUB_URL: ${{ github.event.inputs.hub_url || 'https://capitalalpha.pages.dev' }}
        run: python CapitalMakerCloud/scripts/cinematic_ads_pack.py --only "${{ github.event.inputs.which_ad || 'rotate' }}"

      - name: Upload Commercial MP4 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: capital-alpha-live-action-ad
          path: output/cinematic_ads/*.mp4
          retention-days: 14
