name: CapitalMaker 24/7 Autonomous Signals (#2)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  broadcast-solana-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore 6h Anti-Spam Cooldown Cache
        uses: actions/cache@v4
        with:
          path: state
          key: signal-cooldowns-${{ github.run_id }}
          restore-keys: |
            signal-cooldowns-

      - name: Scan Live Solana Breakouts & Publish to Telegram
        env:
          BRAND_NAME: ${{ secrets.BRAND_NAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          SOLANA_BOT_REF_URL: ${{ secrets.SOLANA_BOT_REF_URL }}
          EXCHANGE_REF_URL: ${{ secrets.EXCHANGE_REF_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MIN_SIGNAL_SCORE: '65'
        run: python CapitalMakerCloud/scripts/signal_broadcaster.py
